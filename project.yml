name: GTA4Stream
options:
  bundleIdPrefix: com.libertyrecomp
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "2.2.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  GTA4Stream:
    type: application
    platform: iOS
    sources:
      - path: GTA4Stream
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.libertyrecomp.gta4stream
        INFOPLIST_FILE: GTA4Stream/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
